<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Status Tools</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div id="statusMessage" class="message"></div>
        
        <div class="header-with-settings">
            <h2>YT Status Tools</h2>
            <button id="settingsButton" class="settings-button" title="Настройки">⚙️</button>
        </div>
        
        <!-- Основной раздел -->
        <div id="mainView" class="view-section">
            <div class="section">
                <label for="taskList">Список задач (по одной на строку или через запятую):</label>
                <textarea id="taskList" rows="8" placeholder="Вставьте список задач, например:&#10;ITSFT-123&#10;ITSFT-456&#10;ITSFT-789"></textarea>
            </div>

            <div class="button-group">
                <button id="loadStatuses" class="btn btn-success">Получить статусы</button>
                <button id="clearData" class="btn btn-danger">Очистить</button>
            </div>
            <div id="autoSaveIndicator" class="auto-save-indicator" style="display: none;">
                <span>✓ Настройки сохранены автоматически</span>
            </div>
        </div>

        <!-- Раздел настроек -->
        <div id="settingsView" class="view-section" style="display: none;">
            <h3>Настройки подключения</h3>
            
            <div class="section">
                <label for="youtrackHost">YouTrack Host:</label>
                <input type="text" id="youtrackHost" placeholder="https://your-company.youtrack.cloud">
            </div>

            <div class="section">
                <label for="youtrackToken">YouTrack Token:</label>
                <input type="password" id="youtrackToken" placeholder="Введите токен">
            </div>

            <h3 style="margin-top: 20px;">Колонки таблицы результатов</h3>
            <p class="hint">Укажите поля YouTrack для колонок. Доступны: <code>id</code>, <code>summary</code>, <code>project</code>, либо имя кастомного поля из API (например Stage, Priority, core_deadline).</p>
            <div id="tableColumnsList" class="table-columns-list"></div>
            <button type="button" id="addTableColumn" class="btn btn-secondary btn-small" style="margin-top: 8px;">+ Добавить колонку</button>

            <div class="button-group" style="margin-top: 20px;">
                <button id="saveSettings" class="btn btn-primary">Сохранить настройки</button>
                <button id="backToMain" class="btn btn-secondary">Назад</button>
            </div>
            <div id="autoSaveIndicatorSettings" class="auto-save-indicator" style="display: none;">
                <span>✓ Настройки сохранены автоматически</span>
            </div>
        </div>

        <div id="resultsSection" class="results-section" style="display: none;">
            <div class="results-header">
                <h3>Результаты:</h3>
                <div class="results-buttons">
                    <button id="copyResults" class="btn btn-primary btn-small">📋 Копировать таблицу</button>
                </div>
            </div>
            <div id="resultsTableContainer" class="results-table-container">
                <table id="resultsTable" class="results-table">
                    <thead id="resultsTableHead">
                        <tr></tr>
                    </thead>
                    <tbody id="resultsTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
